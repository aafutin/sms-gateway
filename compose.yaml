services:
  php:
    build: ./docker/php
    volumes:
      - .:/var/www/app
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8092}:80"
    volumes:
      - .:/var/www/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sms
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
